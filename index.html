    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
            --warning: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Middle Center Alert Overlay */
        .middle-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        .alert-box {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 20px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            max-width: 80%;
        }

        .alert-box.error {
            border-color: var(--warning);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .alert-box h4 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .alert-box p {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Ad Banner */
        .ad-banner-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            text-align: center;
            padding: 5px;
        }

        /* Balance & Stats Card */
        .stats-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .balance-box h3 {
            font-size: 14px;
            color: #94a3b8;
        }

        .balance-box .points {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        /* Action Buttons Grid */
        .action-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #334155;
        }

        .btn-double-ads {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-auto-ads {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-auto-ads:disabled, .btn-double-ads:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Dynamic Rotating Banner */
        .rotating-ads-box {
            background: #111827;
            border: 1px dashed #6366f1;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* Bonus Ads Section */
        .scroll-ads-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #334155;
        }

        .scroll-ads-title {
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
        }

        .scroll-ads-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .scroll-ad-item {
            min-width: 130px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Withdraw Form */
        .withdraw-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .withdraw-input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }

        .btn-withdraw {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Middle Screen Notification -->
<div class="middle-overlay" id="middleOverlay">
    <div class="alert-box" id="alertBox">
        <h4 id="alertTitle">Notification</h4>
        <p id="alertMessage">Message goes here...</p>
    </div>
</div>

<div class="container">
    <!-- AADS AD UNIT -->
    <div class="ad-banner-box">
        <div id="frame" style="width: 100%; margin: auto;">
            <iframe data-aa='2454836' src='//acceptable.a-ads.com/2454836/?size=Adaptive'
                    style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-card">
        <div class="balance-box">
            <h3>Alta Points Balance</h3>
            <div class="points" id="altaBalance">50.00</div>
        </div>
        <div style="text-align: right;">
            <p style="font-size: 12px; color: #94a3b8;">Withdrawals</p>
            <p style="font-size: 16px; font-weight: bold;" id="withdrawCountText">0 Times</p>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-card">
        <button class="btn-double-ads" id="doubleAdsBtn" onclick="triggerDoubleAds()">Double Ads (+0.5 Alta)</button>
        
        <button class="btn-auto-ads" id="autoAdsBtn" onclick="startAutoAds()">
            <div class="spinner" id="autoSpinner"></div>
            <span id="autoBtnText">Auto Ads (0/30)</span>
        </button>
    </div>

    <!-- Dynamic Rotating Text -->
    <div class="rotating-ads-box" id="rotatingAdText" onclick="triggerDirectAd()">
        Sponsored: High Yield Trading & Crypto Offers
    </div>

    <!-- Bonus Ads Section (Points Hidden) -->
    <div class="scroll-ads-container">
        <div class="scroll-ads-title">🔥 Bonus Ads</div>
        <div class="scroll-ads-list">
            <div class="scroll-ad-item" onclick="triggerBonusAd(0)">
                <p>Bonus Offer #1</p>
            </div>
            <div class="scroll-ad-item" onclick="triggerBonusAd(1)">
                <p>Bonus Offer #2</p>
            </div>
            <div class="scroll-ad-item" onclick="triggerBonusAd(2)">
                <p>Bonus Offer #3</p>
            </div>
            <div class="scroll-ad-item" onclick="triggerBonusAd(3)">
                <p>Bonus Offer #4</p>
            </div>
        </div>
    </div>

    <!-- Withdrawal Form -->
    <div class="withdraw-card">
        <h3 style="margin-bottom: 12px;">Withdrawal Request Form</h3>
        <div class="form-group">
            <label>Telegram Username (@Name)</label>
            <input type="text" id="tgName" class="withdraw-input" placeholder="@yourusername">
        </div>
        <div class="form-group">
            <label>Withdrawal Point Amount</label>
            <input type="number" id="withdrawAmount" class="withdraw-input" placeholder="Enter amount">
        </div>
        <div class="form-group">
            <label>TON Wallet Address</label>
            <input type="text" id="tonWallet" class="withdraw-input" placeholder="EQD...">
        </div>
        <button class="btn-withdraw" onclick="submitWithdrawalRequest()">Submit Request to Channel</button>
    </div>
</div>

<script>
    let altaPoints = 50.00;
    let withdrawCount = 0;
    let isDoubleAdRunning = false;
    let isBonusAdRunning = false;

    // Auto Ads States
    let autoClickCount = 0;
    let isAutoAdsRunning = false;
    let autoTimer = null;

    // Direct Links Queue
    const directAdLinks = [
        "https://mammothsubway.com/vqvp77uv?key=e16f5adcebeee070d751d4132045f66e",
        "https://mammothsubway.com/sraj8zz1d?key=80fe52ed90673410b3bd8a6ef1e23f0b",
        "https://alta-rw4e.vercel.app/"
    ];

    // Telegram Bot Details
    const TELEGRAM_BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN";
    const TELEGRAM_CHANNEL_ID = "@YOUR_CHANNEL_ID";

    function updateUI() {
        document.getElementById('altaBalance').innerText = altaPoints.toFixed(2);
        document.getElementById('withdrawCountText').innerText = withdrawCount + " Times";
    }
    updateUI();

    // Middle Screen Notification
    function showMiddleNotification(title, message, isError = false) {
        const overlay = document.getElementById('middleOverlay');
        const box = document.getElementById('alertBox');
        
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerText = message;
        
        if (isError) box.classList.add('error');
        else box.classList.remove('error');

        overlay.style.display = "flex";

        setTimeout(() => {
            overlay.style.display = "none";
        }, 3500);
    }

    // Direct Link Open Helper
    function triggerDirectAd() {
        const url = directAdLinks[Math.floor(Math.random() * directAdLinks.length)];
        window.open(url, '_blank');
    }

    // 1. Double Ads Logic (Hidden Timer, Verification on Active Focus)
    function triggerDoubleAds() {
        if (isDoubleAdRunning) return;

        isDoubleAdRunning = true;
        const btn = document.getElementById('doubleAdsBtn');
        btn.disabled = true;

        triggerDirectAd();

        let startTime = Date.now();

        let checkInterval = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;

            if (elapsed >= 15) {
                clearInterval(checkInterval);
                altaPoints += 0.50;
                updateUI();
                showMiddleNotification("Success!", "15 seconds completed! +0.5 Alta added.");
                btn.disabled = false;
                isDoubleAdRunning = false;
            }
        }, 1000);
    }

    // 2. Auto Ads Logic (0/30 trigger -> 4 Hours Loading -> +20 Alta)
    function startAutoAds() {
        if (isAutoAdsRunning) return;

        // Count clicks up to 30
        autoClickCount++;
        triggerDirectAd();

        const btnText = document.getElementById('autoBtnText');
        const spinner = document.getElementById('autoSpinner');
        const btn = document.getElementById('autoAdsBtn');

        if (autoClickCount < 30) {
            btnText.innerText = `Auto Ads (${autoClickCount}/30)`;
            showMiddleNotification("Auto Ads Progress", `Click registered (${autoClickCount}/30). Complete 30 clicks to start Auto Mode.`);
        } else {
            // Reached 30 clicks -> Start 4 Hour Automation
            isAutoAdsRunning = true;
            btn.disabled = true;
            spinner.style.display = "block";
            btnText.innerText = "Auto Ads Running (4:00:00)...";

            showMiddleNotification("Auto Ads Started", "Auto Ads is now active for 4 hours. Loading in background...");

            let totalSeconds = 4 * 3600; // 4 Hours

            autoTimer = setInterval(() => {
                totalSeconds--;
                
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                btnText.innerText = `Running (${hours}:${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds})`;

                if (totalSeconds <= 0) {
                    clearInterval(autoTimer);
                    altaPoints += 20.0;
                    updateUI();
                    
                    showMiddleNotification("Auto Ads Complete", "4 Hours Completed! +20 Alta automatically added.");
                    
                    // Reset State
                    autoClickCount = 0;
                    isAutoAdsRunning = false;
                    btn.disabled = false;
                    spinner.style.display = "none";
                    btnText.innerText = "Auto Ads (0/30)";
                }
            }, 1000);
        }
    }

    // 3. Bonus Ads Logic (Hidden Timer, Hidden Points Rewards)
    function triggerBonusAd(index) {
        if (isBonusAdRunning) return;

        isBonusAdRunning = true;
        const rewards = [0.5, 1.0, 1.5, 2.0, 2.5];
        const selectedReward = rewards[Math.floor(Math.random() * rewards.length)];

        triggerDirectAd();

        let startTime = Date.now();

        let checkBonus = setInterval(() => {
            let elapsed = (Date.now() - startTime) / 1000;

            if (elapsed >= 15) {
                clearInterval(checkBonus);
                altaPoints += selectedReward;
                updateUI();
                
                showMiddleNotification("Bonus Claimed!", "15 seconds completed! Bonus Alta points added to balance.");
                isBonusAdRunning = false;
            }
        }, 1000);
    }

    // Dynamic Rotating Text
    const rotatingTexts = [
        "Sponsored: High Income Offers Available!",
        "Hot Deal: Instant Payouts via TON Network!",
        "RichPartners: Highest Monetization Yields!"
    ];
    let rIndex = 0;
    setInterval(() => {
        rIndex = (rIndex + 1) % rotatingTexts.length;
        document.getElementById('rotatingAdText').innerText = rotatingTexts[rIndex];
    }, 4000);

    // Telegram Withdrawal Submit
    function submitWithdrawalRequest() {
        const tgName = document.getElementById('tgName').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const tonWallet = document.getElementById('tonWallet').value.trim();

        if (!tgName.startsWith('@')) {
            showMiddleNotification("Error", "Telegram username must start with @", true);
            return;
        }

        if (isNaN(amount) || amount <= 0) {
            showMiddleNotification("Error", "Please enter a valid amount.", true);
            return;
        }

        if (tonWallet.length < 10) {
            showMiddleNotification("Error", "Enter a valid TON Wallet address.", true);
            return;
        }

        if (amount > altaPoints) {
            showMiddleNotification("Error", "Insufficient Alta Balance.", true);
            return;
        }

        altaPoints -= amount;
        withdrawCount++;
        updateUI();

        showMiddleNotification("Success", "Withdrawal Request Sent to Telegram Channel!");
        document.getElementById('withdrawAmount').value = "";
        document.getElementById('tonWallet').value = "";
    }
</script>

</body>
</html>
