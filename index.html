<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Rewards & Ads Platform</title>

    <!-- Verification Meta -->
    <meta name="clckd" content="c2e1a1d976a2b7776dc7b7b19d147dc5" />

    <!-- External Monetag Verification / Tag Script -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="279199" async data-cfasync="false"></script>
    
    <!-- Adcash Auto Tag Script -->
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
        if (typeof aclib !== 'undefined') {
            aclib.runAutoTag({
                zoneId: '1juu12kz4i',
            });

    </script>

    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
            --warning: #ef4444;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Ad Banner Container */
        .ad-banner-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            text-align: center;
            padding: 10px 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 260px;
        }

        .stats-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .balance-box .points {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }

        .action-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #334155;
        }

        .btn-auto-ads {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
            width: 100%;
        }

        .btn-daily-claim {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-auto-ads:disabled, .btn-daily-claim:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* High CTR Bonus Ads Section */
        .scroll-ads-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .scroll-ads-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .scroll-ad-item {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--gold);
            padding: 15px 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .scroll-ad-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .scroll-ad-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .scroll-ad-item .badge {
            position: absolute;
            top: 0; right: 0;
            background: var(--gold);
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-bottom-left-radius: 6px;
        }

        .scroll-ad-item p {
            font-size: 13px;
            font-weight: bold;
            color: #f1f5f9;
            margin-top: 5px;
        }

        .withdraw-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .withdraw-input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .withdraw-input:focus {
            border-color: var(--primary);
        }

        .btn-withdraw {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        .offline-blocker {
            pointer-events: none !important;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- Top Banner Ad Placement -->
    <div class="ad-banner-box">
        <script>
          atOptions = {
            'key' : 'd7df14c97756d36ac44df8b8b9ac8f81',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://mammothsubway.com/d7df14c97756d36ac44df8b8b9ac8f81/invoke.js"></script>
    </div>

    <!-- Stats -->
    <div class="stats-card">
        <div class="balance-box">
            <h3 style="font-size: 14px; color: #94a3b8;">Alta Points Balance</h3>
            <div class="points" id="altaBalance">0.00</div>
        </div>
        <div style="text-align: right;">
            <p style="font-size: 12px; color: #94a3b8;">Withdrawals</p>
            <p style="font-size: 16px; font-weight: bold;" id="withdrawCountText">0 Times</p>
        </div>
    </div>

    <!-- Daily High-Revenue Claim Option -->
    <button class="btn-daily-claim" id="dailyClaimBtn" onclick="handleDailyClaim()">
        🎁 Claim Daily Reward (+10.0 Alta)
    </button>

    <!-- Actions (Auto Mining) -->
    <div class="action-card">
        <button class="btn-auto-ads" id="autoAdsBtn" onclick="handleAutoAdsClick()">
            <div class="spinner" id="autoSpinner"></div>
            <span id="autoBtnText">Auto Ads (0/30)</span>
        </button>
    </div>

    <!-- High-CTR Bonus Ads Section -->
    <div class="scroll-ads-container">
        <div style="font-size: 14px; margin-bottom: 10px; color: var(--gold); font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
            <span>🔥 High Reward Bonus Offers</span>
            <span style="font-size: 11px; color: #22c55e;">2X CPM Boost Active</span>
        </div>
        <div class="scroll-ads-list">
            <div class="scroll-ad-item" id="bonusBtn0" onclick="triggerBonusAd(0)">
                <span class="badge">HOT</span>
                <p id="bonusText0">🎁 Mystery Chest #1</p>
                <span style="font-size: 10px; color: #94a3b8;">Up to +3.0 Alta</span>
            </div>
            <div class="scroll-ad-item" id="bonusBtn1" onclick="triggerBonusAd(1)">
                <span class="badge">HIGH CPM</span>
                <p id="bonusText1">💎 Premium Sponsor #2</p>
                <span style="font-size: 10px; color: #94a3b8;">Up to +3.0 Alta</span>
            </div>
            <div class="scroll-ad-item" id="bonusBtn2" onclick="triggerBonusAd(2)">
                <span class="badge">VIP 2X</span>
                <p id="bonusText2">🚀 Instant Boost #3</p>
                <span style="font-size: 10px; color: #94a3b8;">Up to +5.0 Alta</span>
            </div>
            <div class="scroll-ad-item" id="bonusBtn3" onclick="triggerBonusAd(3)">
                <span class="badge">EXCLUSIVE</span>
                <p id="bonusText3">⚡ Mega Reward #4</p>
                <span style="font-size: 10px; color: #94a3b8;">Up to +5.0 Alta</span>
            </div>
        </div>
    </div>

    <!-- Withdraw Form -->
    <div class="withdraw-card">
        <h3 style="margin-bottom: 12px;">Withdrawal Request Form</h3>
        <div class="form-group">
            <label style="font-size: 12px; color: #94a3b8;">Telegram Username (@Name)</label>
            <input type="text" id="tgName" class="withdraw-input" placeholder="@yourusername">
        </div>
        <div class="form-group">
            <label style="font-size: 12px; color: #94a3b8;">Withdrawal Point Amount</label>
            <input type="number" id="withdrawAmount" class="withdraw-input" placeholder="Min: 50 Points">
        </div>
        <div class="form-group">
            <label style="font-size: 12px; color: #94a3b8;">TON Wallet Address</label>
            <input type="text" id="tonWallet" class="withdraw-input" placeholder="EQD...">
        </div>
        <button class="btn-withdraw" onclick="submitWithdrawalRequest()">Submit Request</button>
    </div>
</div>

<script>
    // System Data Initialization
    let altaPoints = parseFloat(localStorage.getItem('altaPoints'));
    if (isNaN(altaPoints)) {
        altaPoints = 0.00;
    }
    let withdrawCount = parseInt(localStorage.getItem('withdrawCount')) || 0;
    let autoClickCount = parseInt(localStorage.getItem('autoClickCount')) || 0;
    let miningEndTime = parseInt(localStorage.getItem('miningEndTime')) || 0;
    let lastDailyClaim = parseInt(localStorage.getItem('lastDailyClaim')) || 0;

    let isAutoAdCooldown = false;
    let isBonusAdRunning = false;
    let miningTimerInterval = null;

    const MIN_WITHDRAW_FIRST = 50.0;
    const MIN_WITHDRAW_SUBSEQUENT = 50.0;
    const REQUIRED_RESERVE_BALANCE = 300.0;
    const MINING_DURATION_MS = 4 * 60 * 60 * 1000; // 4 Hours

    // Monetag & High-CPM Direct Ad Links Rotation
    const directAdLinks = [
        "https://mammothsubway.com/vqvp77uv?key=e16f5adcebeee070d751d4132045f66e",
        "https://mammothsubway.com/sraj8zz1d?key=80fe52ed90673410b3bd8a6ef1e23f0b"
    ];

    const randomRewards = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 5.0];

    function updateUI() {
        document.getElementById('altaBalance').innerText = altaPoints.toFixed(2);
        document.getElementById('withdrawCountText').innerText = withdrawCount + " Times";
        localStorage.setItem('altaPoints', altaPoints);
        localStorage.setItem('withdrawCount', withdrawCount);
        localStorage.setItem('autoClickCount', autoClickCount);
        localStorage.setItem('miningEndTime', miningEndTime);
        localStorage.setItem('lastDailyClaim', lastDailyClaim);

        // Daily Claim Button Check
        const now = Date.now();
        const dailyBtn = document.getElementById('dailyClaimBtn');
        if (now - lastDailyClaim < 24 * 60 * 60 * 1000) {
            dailyBtn.disabled = true;
            dailyBtn.innerText = "Daily Reward Claimed (Come back tomorrow)";
        } else {
            dailyBtn.disabled = false;
            dailyBtn.innerText = "🎁 Claim Daily Reward (+10.0 Alta)";
        }
    }

    // High Revenue Dual-Tab Ad Opener
    function triggerDirectAd() {
        if (!navigator.onLine) return;
        const url1 = directAdLinks[Math.floor(Math.random() * directAdLinks.length)];
        window.open(url1, '_blank');
    }

    // --- Daily Claim System ---
    function handleDailyClaim() {
        if (!checkInternetConnection()) return;
        triggerDirectAd();
        lastDailyClaim = Date.now();
        altaPoints += 10.0;
        updateUI();
        alert("Daily Reward (+10.0 Alta) Claimed!");
    }

    // --- Auto Ads & 15-Second Cooldown System ---
    function handleAutoAdsClick() {
        if (!checkInternetConnection()) return;
        if (miningEndTime > Date.now()) return;
        if (isAutoAdCooldown) return;

        triggerDirectAd();
        autoClickCount++;

        if (autoClickCount < 30) {
            updateUI();
            startAutoAd15sCooldown();
        } else {
            // Start 4-Hour Mining Mode
            miningEndTime = Date.now() + MINING_DURATION_MS;
            updateUI();
            startMiningTimer();
        }
    }

    function startAutoAd15sCooldown() {
        isAutoAdCooldown = true;
        const btn = document.getElementById('autoAdsBtn');
        const btnText = document.getElementById('autoBtnText');
        btn.disabled = true;

        let timeLeft = 15;
        btnText.innerText = `Wait ${timeLeft}s... (${autoClickCount}/30)`;

        const cooldownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                btnText.innerText = `Wait ${timeLeft}s... (${autoClickCount}/30)`;
            } else {
                clearInterval(cooldownInterval);
                btn.disabled = false;
                isAutoAdCooldown = false;
                btnText.innerText = `Auto Ads (${autoClickCount}/30)`;
            }
        }, 1000);
    }

    function startMiningTimer() {
        const btn = document.getElementById('autoAdsBtn');
        const btnText = document.getElementById('autoBtnText');
        const spinner = document.getElementById('autoSpinner');

        btn.disabled = true;
        spinner.style.display = "block";

        if (miningTimerInterval) clearInterval(miningTimerInterval);

        miningTimerInterval = setInterval(() => {
            const remainingTime = miningEndTime - Date.now();

            if (remainingTime <= 0) {
                clearInterval(miningTimerInterval);
                altaPoints += 20.0;
                autoClickCount = 0;
                miningEndTime = 0;
                updateUI();

                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Auto Ads (0/30)";
            } else {
                const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                
                const hStr = hours < 10 ? "0" + hours : hours;
                const mStr = minutes < 10 ? "0" + minutes : minutes;
                const sStr = seconds < 10 ? "0" + seconds : seconds;

                btnText.innerText = `Mining... (${hStr}:${mStr}:${sStr})`;
            }
        }, 1000);
    }

    // --- High CTR Bonus Ads (15-Second Delay) ---
    function triggerBonusAd(index) {
        if (!checkInternetConnection()) return;
        if (isBonusAdRunning) return;

        isBonusAdRunning = true;
        triggerDirectAd();

        const itemBox = document.getElementById(`bonusBtn${index}`);
        const itemText = document.getElementById(`bonusText${index}`);
        const originalText = itemText.innerText;

        itemBox.classList.add('disabled');
        let timeLeft = 15;
        itemText.innerText = `Wait ${timeLeft}s...`;

        const bonusInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                itemText.innerText = `Wait ${timeLeft}s...`;
            } else {
                clearInterval(bonusInterval);
                const randomPoint = randomRewards[Math.floor(Math.random() * randomRewards.length)];
                altaPoints += randomPoint;
                updateUI();
                
                itemText.innerText = originalText;
                itemBox.classList.remove('disabled');
                isBonusAdRunning = false;
            }
        }, 1000);
    }

    // --- Withdrawal System ---
    function submitWithdrawalRequest() {
        if (!checkInternetConnection()) return;

        const tgName = document.getElementById('tgName').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const tonWallet = document.getElementById('tonWallet').value.trim();

        if (!tgName || !tonWallet || isNaN(amount)) {
            alert("Please fill in all details correctly.");
            return;
        }

        if (withdrawCount === 0) {
            if (amount < MIN_WITHDRAW_FIRST) {
                alert(`First withdrawal requires minimum ${MIN_WITHDRAW_FIRST} Alta.`);
                return;
            }
            if (amount > altaPoints) {
                alert("Insufficient balance.");
                return;
            }
        } else {
            if (amount < MIN_WITHDRAW_SUBSEQUENT) {
                alert(`Minimum withdrawal amount is ${MIN_WITHDRAW_SUBSEQUENT} Alta.`);
                return;
            }
            if ((altaPoints - amount) < REQUIRED_RESERVE_BALANCE) {
                alert(`You must keep at least ${REQUIRED_RESERVE_BALANCE} Alta in reserve balance.`);
                return;
            }
        }

        altaPoints -= amount;
        withdrawCount++;
        updateUI();

        document.getElementById('withdrawAmount').value = '';
        document.getElementById('tgName').value = '';
        document.getElementById('tonWallet').value = '';

        alert("Withdrawal request submitted successfully.");
    }

    // --- Offline / Internet Network Checking ---
    function checkInternetConnection() {
        if (!navigator.onLine) {
            alert("No Internet Connection! Please reconnect to proceed.");
            return false;
        }
        return true;
    }

    function handleNetworkStatusChange() {
        const container = document.getElementById('mainContainer');
        if (!navigator.onLine) {
            container.classList.add('offline-blocker');
        } else {
            container.classList.remove('offline-blocker');
        }
    }

    window.addEventListener('online', handleNetworkStatusChange);
    window.addEventListener('offline', handleNetworkStatusChange);

    // Initial Setup on Page Load
    window.onload = function() {
        updateUI();
        if (miningEndTime > Date.now()) {
            startMiningTimer();
        } else if (autoClickCount > 0 && autoClickCount < 30) {
            document.getElementById('autoBtnText').innerText = `Auto Ads (${autoClickCount}/30)`;
        }
        handleNetworkStatusChange();
    };
</script>

</body>
</html>
