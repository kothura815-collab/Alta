    <style>

        .ad-modal-overlay.active { display: flex; }

<body oncontextmenu="return false;">

<div class="container">

            <label style="font-size: 9px; color: var(--text-muted);">@USERNAME</label>

        <div style="margin-bottom: 8px;">

            <input type="text" id="tonWallet" class="withdraw-input" placeholder="EQD...">

        <button class="btn-withdraw" onclick="submitWithdrawalRequest(event)">SUBMIT REQUEST</button>
    </div>
</div>

<div id="toast" class="toast-notification"></div>

<script>
    // Advanced Security Guard: Frame Busting & Anti-Debugging Controls
    if (window.top !== window.self) { window.top.location = window.self.location; }
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
        }
    });

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    // Adsgram Controllers Setup
    const AdControllerReward = window.Adsgram ? window.Adsgram.init({ blockId: "48398" }) : null;
    const AdControllerInterstitial = window.Adsgram ? window.Adsgram.init({ blockId: "int-48399" }) : null;

    let alphaPoints = parseFloat(localStorage.getItem('alphaPoints')) || 0.00;
    let withdrawCount = parseInt(localStorage.getItem('withdrawCount')) || 0;
    let autoClickCount = parseInt(localStorage.getItem('autoClickCount')) || 0;
    let lastDailyClaim = parseInt(localStorage.getItem('lastDailyClaim')) || 0;
    let autoCooldownEnd = parseInt(localStorage.getItem('autoCooldownEnd')) || 0;

    let isAdProcessing = false;
    let pendingAdType = null;
    let countdownInterval = null;
    let cooldownTimerInterval = null;

    // Direct Links Configuration
    const primaryDirectLinks = [
        "https://omg10.com/4/11776333",
        "https://omg10.com/4/11783730",
        "https://omg10.com/4/11786275",
        "https://plump-plastic.com/ke5WQR"
    ];

    const secondaryDirectLinks = [
        "https://mammothsubway.com/sraj8zz1d?key=80fe52ed90673410b3bd8a6ef1e23f0b",
        "https://mammothsubway.com/vqvp77uv?key=e16f5adcebeee070d751d4132045f66e",
        "https://plump-plastic.com/ke5WQR"
    ];

    function guardNetwork() {
        document.getElementById('offlineLock').style.display = navigator.onLine ? 'none' : 'flex';
    }
    window.addEventListener('online', guardNetwork);
    window.addEventListener('offline', guardNetwork);

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function shareToTelegram() {
        const url = `https://t.me/share/url?url=${encodeURIComponent("https://t.me/AlphaAdsReward_bot")}&text=${encodeURIComponent("🚀 Join ALPHA ADS MINER!")}`;
        if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, '_blank');
    }

    function formatTimeLeft(ms) {
        const totalSecs = Math.floor(ms / 1000);
        const hrs = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        return `${hrs}h ${mins}m ${secs}s`;
    }

    function updateAutoAdsButton() {
        const autoBtn = document.getElementById('autoAdsBtn');
        const autoBtnText = document.getElementById('autoBtnText');
        const now = Date.now();

        if (now < autoCooldownEnd) {
            autoBtn.disabled = true;
            autoBtnText.innerText = `⏳ Cooldown (${formatTimeLeft(autoCooldownEnd - now)})`;
        } else {
            if (autoCooldownEnd > 0 && now >= autoCooldownEnd) {
                autoClickCount = 0;
                autoCooldownEnd = 0;
                localStorage.setItem('autoClickCount', 0);
                localStorage.setItem('autoCooldownEnd', 0);
            }
            autoBtn.disabled = false;
            autoBtnText.innerText = `Auto Ads (${autoClickCount}/30)`;
        }
    }

    function updateUI() {
        document.getElementById('alphaBalance').innerText = alphaPoints.toFixed(2);
        document.getElementById('withdrawCountText').innerText = withdrawCount + " Times";
        
        localStorage.setItem('alphaPoints', alphaPoints);
        localStorage.setItem('withdrawCount', withdrawCount);
        localStorage.setItem('autoClickCount', autoClickCount);
        localStorage.setItem('autoCooldownEnd', autoCooldownEnd);

        updateAutoAdsButton();

        const now = Date.now();
        const btn = document.getElementById('dailyClaimBtn');
        if (now - lastDailyClaim < 86400000) {
            btn.disabled = true;
            btn.innerText = `⏳ Claimed Today`;
        } else {
            btn.disabled = false;
            btn.innerText = `🎁 Daily Reward (+10 ALPHA)`;
        }
    }

    function initMonetagInApp() {
        if (typeof show_11786265 === 'function') {
            try {
                show_11786265({
                    type: 'inApp',
                    inAppSettings: {
                        frequency: 2,
                        capping: 0.1,
                        interval: 30,
                        timeout: 5,
                        everyPage: false
                    }
                });
            } catch(e){}
        }
    }

    async function triggerAdsgramAds() {
        if (AdControllerReward) {
            try {
                const res = await AdControllerReward.show();
                if (res && res.done) return;
            } catch (err) {}
        }
        if (AdControllerInterstitial) {
            try {
                await AdControllerInterstitial.show();
            } catch (err) {}
        }
    }

    async function handleClick(type, e) {
        if (!navigator.onLine || isAdProcessing) return;

        if (type === 'auto') {
            if (Date.now() < autoCooldownEnd) {
                showToast("Auto Ads is on cooldown!");
                return;
            }
        }

        isAdProcessing = true;
        pendingAdType = type;

        await triggerAdsgramAds();

        const targetLink = primaryDirectLinks[Math.floor(Math.random() * primaryDirectLinks.length)];
        if (tg && tg.openLink) tg.openLink(targetLink);
        else window.open(targetLink, '_blank');

        start15sModal();
    }

    function handleDailyClick(e) {
        if (Date.now() - lastDailyClaim >= 86400000) handleClick('daily', e);
    }

    function start15sModal() {
        const modal = document.getElementById('adModal');
        const timerText = document.getElementById('modalCountdown');
        const btnContinue = document.getElementById('btnContinue');

        modal.classList.add('active');
        btnContinue.style.display = 'none';

        let timeLeft = 15;
        timerText.innerText = timeLeft;

        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            timerText.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerText.innerText = "Done!";
                btnContinue.style.display = 'block';
            }
        }, 1000);
    }

    function triggerMonetagAdSequence() {
        return new Promise((resolve) => {
            if (typeof show_11786265 === 'function') {
                show_11786265().then(() => {
                    resolve();
                }).catch(() => {
                    if (typeof show_11786265 === 'function') {
                        show_11786265('pop').then(() => resolve()).catch(() => resolve());
                    } else {
                        resolve();
                    }
                });
            } else {
                resolve();
            }
        });
    }

    async function completeAdProcess() {
        document.getElementById('adModal').classList.remove('active');

        const secondLink = secondaryDirectLinks[Math.floor(Math.random() * secondaryDirectLinks.length)];
        if (tg && tg.openLink) tg.openLink(secondLink);
        else window.open(secondLink, '_blank');

        await triggerMonetagAdSequence();

        if (pendingAdType === 'daily') {
            alphaPoints += 10.00;
            lastDailyClaim = Date.now();
            localStorage.setItem('lastDailyClaim', lastDailyClaim);
        } else if (pendingAdType === 'auto') {
            autoClickCount++;
            if (autoClickCount >= 30) {
                alphaPoints += 5.00;
                autoCooldownEnd = Date.now() + (4 * 60 * 60 * 1000);
                showToast("🎉 Auto Ads 30/30 Completed! +5 ALPHA Added. Cooldown Started.");
            } else {
                const added = parseFloat((Math.random() * 1.4 + 0.1).toFixed(2));
                alphaPoints += added;
            }
        } else {
            const added = parseFloat((Math.random() * 1.4 + 0.1).toFixed(2));
            alphaPoints += added;
        }

        isAdProcessing = false;
        pendingAdType = null;
        updateUI();
        if (autoClickCount < 30 || pendingAdType !== 'auto') {
            showToast("✅ Reward Awarded!");
        }
    }

    async function submitWithdrawalRequest(e) {
        const tgName = document.getElementById('tgName').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const tonWallet = document.getElementById('tonWallet').value.trim();

        if (!tgName || !tonWallet || isNaN(amount) || amount < 50) {
            showToast("Invalid Amount or Minimum is 50 ALPHA!");
            return;
        }

        if (withdrawCount >= 1) {
            const maxAllowed = alphaPoints - 150;
            if (maxAllowed < 50) {
                showToast("Must reserve 150 ALPHA for 2nd+ withdrawal!");
                return;
            }
            if (amount > maxAllowed) {
                showToast(`Max withdrawable: ${maxAllowed.toFixed(2)} ALPHA (150 Reserved)!`);
                return;
            }
        } else {
            if (alphaPoints < amount) {
                showToast("Insufficient Balance!");
                return;
            }
        }

        alphaPoints -= amount;
        withdrawCount++;
        updateUI();

        const historyText = `🚨 NEW WITHDRAWAL REQUEST 🚨\n\n👤 User: ${tgName}\n💰 Amount: ${amount} ALPHA\n💎 Wallet: ${tonWallet}\n🔢 Total Withdrawals: ${withdrawCount} Time(s)`;

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHANNEL_ID,
                    text: historyText
                })
            });
            showToast("✅ Withdrawal Submitted & Broadcasted!");
        } catch (err) {
            showToast("✅ Request Processed!");
        }

        document.getElementById('withdrawAmount').value = '';
        document.getElementById('tonWallet').value = '';
    }

    window.onload = function() {
        guardNetwork();
        updateUI();
        initMonetagInApp();
        
        cooldownTimerInterval = setInterval(updateAutoAdsButton, 1000);
    };
</script>
