<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALTA ADS MINER</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 1. Monetag Essential In-App SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11786265' data-sdk='show_11786265' async></script>

    <!-- 2. Adsterra Anti-Adblock Async Script (Lightweight & Safe) -->
    <script type="text/javascript" src="//mammothsubway.com/c4/1f/8d/c41f8d42d0bc9a50bd44474bf82098b1.js" async></script>

    <style>
        :root {
            --primary: #10b981;
            --bg: #050806;
            --card-bg: #0b120e;
            --border-color: #152b1e;
            --text-muted: #6b7c72;
            --text-main: #ecfdf5;
            --accent: #34d399;
            --gold: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .offline-lock {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 5, 0.98);
            z-index: 999999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--danger);
            text-align: center;
            padding: 20px;
        }

        body.offline-active .container {
            pointer-events: none !important;
            filter: blur(5px);
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }

        .cyber-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid var(--border-color);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-title {
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: bold;
        }

        .stats-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-box .points {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent);
        }

        .auto-sponsored-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auto-card { cursor: pointer; }

        .auto-card-title {
            font-size: 11px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .auto-media-box {
            width: 100%;
            height: 160px;
            border-radius: 6px;
            overflow: hidden;
            background: #030705;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auto-media-box img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .btn-action {
            background: linear-gradient(180deg, #092015 0%, #05140d 100%);
            color: var(--accent);
            border: 1px solid var(--primary);
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        .btn-daily-claim {
            background: linear-gradient(135deg, #d97706, #059669);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        .btn-daily-claim:disabled {
            background: #141f18;
            color: #4b5563;
            cursor: not-allowed;
        }

        .btn-share {
            background: linear-gradient(135deg, #0088cc, #005580);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        .scroll-ads-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .scroll-ad-item {
            background: #040a07;
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }

        .withdraw-input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #030705;
            color: var(--text-main);
            outline: none;
            font-size: 12px;
            margin-top: 4px;
        }

        .btn-withdraw {
            background: linear-gradient(180deg, #0f3824 0%, #081f14 100%);
            color: var(--accent);
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .toast-notification {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #0b120e;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10000;
            display: none;
            text-align: center;
        }

        .ad-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 5, 0.95);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ad-modal-overlay.active { display: flex; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="offline-lock" id="offlineLock">
    <h2>🚫 NO INTERNET CONNECTION</h2>
</div>

<div class="ad-modal-overlay" id="adModal">
    <h2 style="color: var(--accent);">⏳ Loading Sponsor Ad...</h2>
    <div style="font-size: 36px; color: var(--gold); margin: 15px 0;" id="modalCountdown">15</div>
    <button class="btn-daily-claim" id="btnContinue" style="display:none; width:auto; padding: 10px 24px;" onclick="completeAdProcess()">Continue</button>
</div>

<div class="container">

    <div class="cyber-card node-header">
        <span class="node-title">⚡ ALTA ADS MINER</span>
        <span style="color: var(--accent); font-size: 11px;">● Active</span>
    </div>

    <div class="cyber-card stats-card">
        <div class="balance-box">
            <h3 style="font-size: 10px; color: var(--text-muted);">ALTA POINTS BALANCE</h3>
            <div class="points" id="altaBalance">0.00</div>
        </div>
        <div style="text-align: right;">
            <p style="font-size: 10px; color: var(--text-muted);">WITHDRAWALS</p>
            <p style="font-size: 14px; font-weight: bold;" id="withdrawCountText">0 Times</p>
        </div>
    </div>

    <div class="auto-sponsored-section">
        <div class="cyber-card auto-card" onclick="handleClick('sponsor', event)">
            <div class="auto-card-title">
                <span>🎬 Sponsored Ad (High CPM)</span>
                <span style="color: var(--accent);">Tap to Claim</span>
            </div>
            <div class="auto-media-box">
                <img id="rotatingPhoto" src="Photo1.webp" alt="Sponsor Banner">
            </div>
        </div>
    </div>

    <div class="cyber-card">
        <button class="btn-action" id="autoAdsBtn" onclick="handleClick('auto', event)">
            <span id="autoBtnText">Auto Ads (0/30)</span>
        </button>
    </div>

    <div class="cyber-card">
        <button class="btn-daily-claim" id="dailyClaimBtn" onclick="handleDailyClick(event)">
            🎁 Daily Reward (+10 ALTA)
        </button>
    </div>

    <div class="cyber-card">
        <button class="btn-share" onclick="shareToTelegram()">✈️ Share Bot</button>
    </div>

    <div class="cyber-card">
        <div style="font-size: 11px; margin-bottom: 10px; color: var(--gold); font-weight: bold;">🔥 HIGH REWARD OFFERS</div>
        <div class="scroll-ads-list">
            <div class="scroll-ad-item" onclick="handleClick('bonus', event)">
                <p style="font-size: 11px;">🎁 Bonus Offers #1</p>
                <span style="font-size: 10px; color: var(--text-muted);">0.1 - 1.5 ALTA</span>
            </div>
            <div class="scroll-ad-item" onclick="handleClick('bonus', event)">
                <p style="font-size: 11px;">💎 Premium Offer #2</p>
                <span style="font-size: 10px; color: var(--text-muted);">0.1 - 1.5 ALTA</span>
            </div>
        </div>
    </div>

    <div class="cyber-card">
        <h3 style="margin-bottom: 10px; font-size: 12px; color: var(--accent);">WITHDRAW</h3>
        <div style="margin-bottom: 8px;">
            <label style="font-size: 9px; color: var(--text-muted);">@USERNAME</label>
            <input type="text" id="tgName" class="withdraw-input" placeholder="@yourusername">
        </div>
        <div style="margin-bottom: 8px;">
            <label style="font-size: 9px; color: var(--text-muted);">AMOUNT (MIN 50)</label>
            <input type="number" id="withdrawAmount" class="withdraw-input" placeholder="50">
        </div>
        <div style="margin-bottom: 8px;">
            <label style="font-size: 9px; color: var(--text-muted);">TON WALLET ADDRESS</label>
            <input type="text" id="tonWallet" class="withdraw-input" placeholder="EQD...">
        </div>
        <button class="btn-withdraw" onclick="submitWithdrawalRequest(event)">SUBMIT REQUEST</button>
    </div>
</div>

<div id="toast" class="toast-notification"></div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let altaPoints = parseFloat(localStorage.getItem('altaPoints')) || 0.00;
    let withdrawCount = parseInt(localStorage.getItem('withdrawCount')) || 0;
    let autoClickCount = parseInt(localStorage.getItem('autoClickCount')) || 0;
    let lastDailyClaim = parseInt(localStorage.getItem('lastDailyClaim')) || 0;
    
    let isAdProcessing = false;
    let pendingAdType = null;
    let countdownInterval = null;

    // Multi-Network Rotating Direct Links (Monetag + Adsterra + RichAds)
    const highCpmLinks = [
        "https://omg10.com/4/11776333",
        "https://omg10.com/4/11783730",
        "https://omg10.com/4/11786275"
    ];

    const photos = ["Photo1.webp", "Photo2.webp", "Photo3.webp", "Photo4.webp", "Photo5.webp"];
    let currentPhotoIndex = 0;

    function guardNetwork() {
        document.getElementById('offlineLock').style.display = navigator.onLine ? 'none' : 'flex';
    }
    window.addEventListener('online', guardNetwork);
    window.addEventListener('offline', guardNetwork);

    function startPhotoRotation() {
        setInterval(() => {
            if (navigator.onLine) {
                currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
                document.getElementById('rotatingPhoto').src = photos[currentPhotoIndex];
            }
        }, 5000);
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function shareToTelegram() {
        const url = `https://t.me/share/url?url=${encodeURIComponent("https://t.me/AltaHub_ads_withdraw_history")}&text=${encodeURIComponent("🚀 Join ALTA ADS MINER!")}`;
        if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, '_blank');
    }

    function updateUI() {
        document.getElementById('altaBalance').innerText = altaPoints.toFixed(2);
        document.getElementById('withdrawCountText').innerText = withdrawCount + " Times";
        document.getElementById('autoBtnText').innerText = `Auto Ads (${autoClickCount}/30)`;
        localStorage.setItem('altaPoints', altaPoints);
        localStorage.setItem('withdrawCount', withdrawCount);
        localStorage.setItem('autoClickCount', autoClickCount);
        
        const now = Date.now();
        const btn = document.getElementById('dailyClaimBtn');
        if (now - lastDailyClaim < 86400000) {
            btn.disabled = true;
            btn.innerText = `⏳ Claimed Today`;
        } else {
            btn.disabled = false;
            btn.innerText = `🎁 Daily Reward (+10 ALTA)`;
        }
    }

    async function handleClick(type, e) {
        if (!navigator.onLine || isAdProcessing) return;
        isAdProcessing = true;
        pendingAdType = type;

        // Open Direct High-CPM Ad Link
        const targetLink = highCpmLinks[Math.floor(Math.random() * highCpmLinks.length)];
        if (tg && tg.openLink) tg.openLink(targetLink);
        else window.open(targetLink, '_blank');

        // Call In-App Monetag SDK Interstitial
        if (typeof show_11786265 === 'function') {
            try { show_11786265(); } catch(err){}
        }

        start15sModal();
    }

    function handleDailyClick(e) {
        if (Date.now() - lastDailyClaim >= 86400000) handleClick('daily', e);
    }

    function start15sModal() {
        const modal = document.getElementById('adModal');
        const timerText = document.getElementById('modalCountdown');
        const btnContinue = document.getElementById('btnContinue');

        modal.classList.add('active');
        btnContinue.style.display = 'none';

        let timeLeft = 15;
        timerText.innerText = timeLeft;

        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            timerText.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerText.innerText = "Complete!";
                btnContinue.style.display = 'block';
            }
        }, 1000);
    }

    function completeAdProcess() {
        document.getElementById('adModal').classList.remove('active');
        if (pendingAdType === 'daily') {
            altaPoints += 10.00;
            lastDailyClaim = Date.now();
            localStorage.setItem('lastDailyClaim', lastDailyClaim);
        } else {
            const added = parseFloat((Math.random() * 1.4 + 0.1).toFixed(2));
            altaPoints += added;
            if (pendingAdType === 'auto') autoClickCount = (autoClickCount + 1) % 31;
        }
        isAdProcessing = false;
        pendingAdType = null;
        updateUI();
        showToast("✅ Points Awarded!");
    }

    function submitWithdrawalRequest(e) {
        const tgName = document.getElementById('tgName').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const tonWallet = document.getElementById('tonWallet').value.trim();

        if (!tgName || !tonWallet || isNaN(amount) || amount < 50 || altaPoints < amount) {
            showToast("Invalid Amount or Insufficient Balance!");
            return;
        }

        altaPoints -= amount;
        withdrawCount++;
        updateUI();

        const historyText = `🚨 WITHDRAWAL REQUEST 🚨\nUser: ${tgName}\nAmount: ${amount} ALTA\nWallet: ${tonWallet}`;
        const channelUrl = `https://t.me/share/url?url=${encodeURIComponent('https://t.me/AltaHub_ads_withdraw_history')}&text=${encodeURIComponent(historyText)}`;
        if (tg && tg.openTelegramLink) tg.openTelegramLink(channelUrl);
        else window.open(channelUrl, '_blank');

        document.getElementById('withdrawAmount').value = '';
        document.getElementById('tonWallet').value = '';
    }

    window.onload = function() {
        guardNetwork();
        updateUI();
        startPhotoRotation();
    };
</script>
</body>
</html>
